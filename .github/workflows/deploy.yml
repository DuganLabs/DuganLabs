name: DuganLabs CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # No `version:` here. package.json's `packageManager` is the single
      # source of truth — pnpm/action-setup errors with "Multiple versions of
      # pnpm specified" if both are set and they disagree.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax-check worker and page scripts
        run: |
          node --check worker/index.js
          for f in pages/js/*.js pages/vendor/basenative/*/*.js; do
            node --check "$f"
          done

      # node:test, no test-runner dependency — nothing to add to the lockfile.
      # `node --test tests/` discovers every *.test.mjs under tests/, so a new
      # file cannot be silently left out of a hand-maintained list.
      - name: Unit tests
        run: pnpm test

      - name: Wrangler dry-run build (no credentials required)
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir=.wrangler-dry

  # Thin caller: delegates to DuganLabs/.github's org-wide cf-worker-deploy.yml
  # instead of a bespoke install+deploy job. Doppler isn't set up for this
  # repo yet, so Cloudflare credentials flow through the documented
  # direct-secret fallback (see DuganLabs/.github's DOPPLER.md).
  #
  # Pinned to @main now that the reusable workflow has merged there. It was
  # pinned to the feature branch while that PR was open; a merged feature
  # branch can be deleted at any time, and this deploy would stop resolving.
  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: DuganLabs/.github/.github/workflows/cf-worker-deploy.yml@main
    with:
      working-directory: "."
      deploy-command: "pnpm exec nx run worker:deploy"
      node-version: "22"
      package-manager: pnpm
      environment: production
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  summary:
    name: Deployment summary
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "## Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker \`duganlabs\` deployed to Cloudflare" >> "$GITHUB_STEP_SUMMARY"
