# MANUAL-ONLY. Every workflow in this org runs on workflow_dispatch and
# nothing else: no push, no pull_request, no schedule. The owner runs it
# from the Actions tab when he wants GitHub minutes spent; everything it
# does also runs on a developer machine via scripts/pipeline.sh (checks)
# and the deploy scripts, from the same Doppler config. (2026-09-14)
name: PendingBusiness app (apps/pendingbusiness-app)

on:
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

defaults:
  run:
    working-directory: apps/pendingbusiness-app/workspace

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/pendingbusiness-app/workspace/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
          cache-dependency-path: apps/pendingbusiness-app/workspace/pnpm-lock.yaml

      - name: Auth to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm nx run-many --target=lint

      - name: Typecheck
        run: pnpm nx run-many --target=typecheck

      - name: Test
        run: pnpm nx run-many --target=test

      - name: Build site
        run: pnpm nx run site:build

      - name: Upload built site artifact
        uses: actions/upload-artifact@v7
        with:
          name: pendingbusiness-site-dist
          path: apps/pendingbusiness-app/workspace/dist/site
          retention-days: 1

  audit:
    name: Lighthouse & Accessibility Audit
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Download built site artifact
        uses: actions/download-artifact@v8
        with:
          name: pendingbusiness-site-dist
          path: apps/pendingbusiness-app/workspace/dist/site

      - name: Install audit toolchain (Playwright + Lighthouse 13.6 + axe-core)
        working-directory: .
        run: |
          pnpm install --frozen-lockfile --filter @duganlabs/audit...
          pnpm --filter @duganlabs/audit exec playwright install --with-deps chromium
          npm install --no-save axe-core

      - name: Run Lighthouse (mobile & desktop) + axe-core against local dist/site
        working-directory: .
        run: |
          node -e '
            const http = require("node:http");
            const fs = require("node:fs");
            const path = require("node:path");
            const root = path.resolve("apps/pendingbusiness-app/workspace/dist/site");
            const mime = { ".html": "text/html; charset=utf-8", ".js": "application/javascript", ".css": "text/css", ".svg": "image/svg+xml", ".json": "application/json", ".png": "image/png", ".ico": "image/x-icon" };
            const server = http.createServer((req, res) => {
              const p = decodeURIComponent(new URL(req.url, "http://127.0.0.1").pathname);
              let f = path.join(root, p === "/" ? "index.html" : p);
              if (!path.extname(f) && fs.existsSync(f + ".html")) f += ".html";
              if (!fs.existsSync(f) || fs.statSync(f).isDirectory()) f = path.join(root, "index.html");
              res.writeHead(200, { "content-type": mime[path.extname(f)] || "application/octet-stream" });
              fs.createReadStream(f).pipe(res);
            });
            server.listen(4179, "127.0.0.1", () => console.log("PB static server on :4179"));
          ' &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:4179/ >/dev/null && break
            sleep 1
          done

          export LIGHTHOUSE_TARGETS='[{"label":"pendingbusiness-home","url":"http://127.0.0.1:4179/"},{"label":"pendingbusiness-login","url":"http://127.0.0.1:4179/login.html"}]'
          node tools/audit/lighthouse.mjs

          node --input-type=module -e '
            import { chromium } from "playwright";
            import { createRequire } from "node:module";
            import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
            const require = createRequire(import.meta.url);
            const axeSource = readFileSync(require.resolve("axe-core/axe.min.js"), "utf8");
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const reports = [];
            for (const route of ["/", "/login.html"]) {
              await page.goto(`http://127.0.0.1:4179${route}`, { waitUntil: "networkidle" });
              await page.evaluate(axeSource);
              const res = await page.evaluate(() => window.axe.run(document));
              reports.push({ route, violations: res.violations.length, items: res.violations.map((v) => ({ id: v.id, impact: v.impact, nodes: v.nodes.length })) });
              console.log(`axe ${route}: ${res.violations.length} violation(s)`);
            }
            await browser.close();
            mkdirSync("dist/audit", { recursive: true });
            writeFileSync("dist/audit/pendingbusiness-axe.json", JSON.stringify(reports, null, 2));
          '

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pendingbusiness-audit-reports
          path: dist/audit/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/pendingbusiness-app/workspace/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
          cache-dependency-path: apps/pendingbusiness-app/workspace/pnpm-lock.yaml

      - name: Auth to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm nx run site:build

      - name: Bootstrap D1 + substitute ID into wrangler.toml
        working-directory: apps/pendingbusiness-app/workspace/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ID=$(pnpm exec wrangler d1 list --json 2>/dev/null | node -e '
            let data = ""; process.stdin.on("data", c => data += c);
            process.stdin.on("end", () => {
              try {
                const rows = JSON.parse(data);
                const row = rows.find(r => r.name === "pendingbusiness");
                if (row) process.stdout.write(row.uuid || row.database_id || "");
              } catch { /* empty */ }
            });
          ')
          if [ -z "$ID" ]; then
            echo "::notice::D1 'pendingbusiness' not found — creating."
            CREATE_OUT=$(pnpm exec wrangler d1 create pendingbusiness 2>&1)
            echo "$CREATE_OUT"
            ID=$(echo "$CREATE_OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          fi
          if [ -z "$ID" ]; then
            echo "::error::Could not resolve D1 database ID."
            exit 1
          fi
          echo "D1 database_id=$ID"
          sed -i "s/PLACEHOLDER_PENDINGBUSINESS_D1_ID/$ID/" wrangler.toml

      - name: Apply D1 migrations
        working-directory: apps/pendingbusiness-app/workspace/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply pendingbusiness --remote

      # Plaid credentials NEVER pass through CI. The Plaid key-encryption key is a
      # Cloudflare Worker runtime secret set once, outside CI, from the
      # unsynced Doppler project `pendingbusiness-runtime` (docs/PLAID-SECRETS.md).
      # Worker secrets persist across `wrangler deploy`, so this job never needs
      # it. The guard fails the run if any workflow starts referencing one.
      - name: Guard - no Plaid secrets in CI
        run: |
          if grep -rnE 'PLAID[_][A-Z_]*KEK|PLAID[_](CLIENT|SECRET)|secrets\.PLAID' ../../../.github/workflows/pendingbusiness-app.yml scripts/pipeline.sh; then
            echo "::error::Plaid secrets must not be referenced in CI. See docs/PLAID-SECRETS.md."
            exit 1
          fi

      - name: Deploy worker
        working-directory: apps/pendingbusiness-app/workspace/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Summary
        run: |
          echo "## Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker \`pending-business\` to private.pendingbusiness.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1 migrations applied to \`pendingbusiness\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site assets bundled to dist/site and uploaded as Worker assets" >> "$GITHUB_STEP_SUMMARY"
