# MANUAL-ONLY. Every workflow in this org runs on workflow_dispatch and
# nothing else: no push, no pull_request, no schedule. The owner runs it
# from the Actions tab when he wants GitHub minutes spent; everything it
# does also runs on a developer machine via scripts/pipeline.sh (checks)
# and the deploy scripts, from the same Doppler config. (2026-09-14)
name: PendingBusiness app (apps/pendingbusiness-app)

on:
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

defaults:
  run:
    working-directory: apps/pendingbusiness-app/workspace

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/pendingbusiness-app/workspace/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
          cache-dependency-path: apps/pendingbusiness-app/workspace/pnpm-lock.yaml

      - name: Auth to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm nx run-many --target=lint

      - name: Typecheck
        run: pnpm nx run-many --target=typecheck

      - name: Test
        run: pnpm nx run-many --target=test

      - name: Build site
        run: pnpm nx run site:build

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/pendingbusiness-app/workspace/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
          cache-dependency-path: apps/pendingbusiness-app/workspace/pnpm-lock.yaml

      - name: Auth to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm nx run site:build

      - name: Bootstrap D1 + substitute ID into wrangler.toml
        working-directory: apps/pendingbusiness-app/workspace/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ID=$(pnpm exec wrangler d1 list --json 2>/dev/null | node -e '
            let data = ""; process.stdin.on("data", c => data += c);
            process.stdin.on("end", () => {
              try {
                const rows = JSON.parse(data);
                const row = rows.find(r => r.name === "pendingbusiness");
                if (row) process.stdout.write(row.uuid || row.database_id || "");
              } catch { /* empty */ }
            });
          ')
          if [ -z "$ID" ]; then
            echo "::notice::D1 'pendingbusiness' not found — creating."
            CREATE_OUT=$(pnpm exec wrangler d1 create pendingbusiness 2>&1)
            echo "$CREATE_OUT"
            ID=$(echo "$CREATE_OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          fi
          if [ -z "$ID" ]; then
            echo "::error::Could not resolve D1 database ID."
            exit 1
          fi
          echo "D1 database_id=$ID"
          sed -i "s/PLACEHOLDER_PENDINGBUSINESS_D1_ID/$ID/" wrangler.toml

      - name: Apply D1 migrations
        working-directory: apps/pendingbusiness-app/workspace/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply pendingbusiness --remote

      # Plaid credentials NEVER pass through CI. The Plaid key-encryption key is a
      # Cloudflare Worker runtime secret set once, outside CI, from the
      # unsynced Doppler project `pendingbusiness-runtime` (docs/PLAID-SECRETS.md).
      # Worker secrets persist across `wrangler deploy`, so this job never needs
      # it. The guard fails the run if any workflow starts referencing one.
      - name: Guard - no Plaid secrets in CI
        run: |
          if grep -rnE 'PLAID[_][A-Z_]*KEK|PLAID[_](CLIENT|SECRET)|secrets\.PLAID' ../../../.github/workflows/pendingbusiness-app.yml scripts/pipeline.sh; then
            echo "::error::Plaid secrets must not be referenced in CI. See docs/PLAID-SECRETS.md."
            exit 1
          fi

      - name: Deploy worker
        working-directory: apps/pendingbusiness-app/workspace/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Summary
        run: |
          echo "## Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker \`pending-business\` to private.pendingbusiness.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1 migrations applied to \`pendingbusiness\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site assets bundled to dist/site and uploaded as Worker assets" >> "$GITHUB_STEP_SUMMARY"
