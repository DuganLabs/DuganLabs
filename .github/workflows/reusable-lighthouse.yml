name: reusable · lighthouse

# Reusable workflow: run Lighthouse 13.6 against a deployed URL across mobile
# and/or desktop (all 5 categories including report-only Agentic browsing) and
# post the scores as a PR comment + job summary. Fails if any gated category
# (Performance, Accessibility, Best Practices, SEO) drops below threshold.

on:
  workflow_call:
    inputs:
      url:
        type: string
        required: true
        description: "Deployed URL to audit (e.g. https://t4bs.com)"
      perf-min:
        type: number
        default: 95
      a11y-min:
        type: number
        default: 95
      best-practices-min:
        type: number
        default: 95
      seo-min:
        type: number
        default: 95
      device:
        type: string
        default: "both"   # mobile | desktop | both
      runs:
        type: number
        default: 3
        description: "Number of Lighthouse runs per form factor (median per metric). Default 3 absorbs CI runner variance without lowering thresholds."

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Lighthouse 13.6
        run: npm install -g lighthouse@13.6

      - name: Run Lighthouse (median of N)
        id: lh
        env:
          URL: ${{ inputs.url }}
          DEVICE: ${{ inputs.device }}
          RUNS: ${{ inputs.runs }}
          PERF_MIN: ${{ inputs.perf-min }}
          A11Y_MIN: ${{ inputs.a11y-min }}
          BP_MIN: ${{ inputs.best-practices-min }}
          SEO_MIN: ${{ inputs.seo-min }}
        run: |
          set -euo pipefail
          rm -f lh-*.json comment.md

          if [ "$DEVICE" = "both" ]; then
            PRESETS="mobile desktop"
          else
            PRESETS="$DEVICE"
          fi

          median() {
            local pattern="$1"
            local key="$2"
            local vals
            vals=$(for f in $pattern; do jq -r "$key" "$f"; done | sort -n)
            local n
            n=$(echo "$vals" | wc -l | tr -d ' ')
            local mid=$(( (n + 1) / 2 ))
            echo "$vals" | sed -n "${mid}p"
          }

          echo "## Lighthouse 13.6 — $URL (median of $RUNS runs)" > comment.md
          echo "" >> comment.md
          echo "| Form factor | Performance | Accessibility | Best Practices | SEO | Agentic browsing (report-only) |" >> comment.md
          echo "|---|---:|---:|---:|---:|---:|" >> comment.md

          FAILED=0

          for preset in $PRESETS; do
            EXTRA_FLAGS="--form-factor=mobile"
            if [ "$preset" = "desktop" ]; then
              EXTRA_FLAGS="--form-factor=desktop --preset=desktop"
            fi

            for i in $(seq 1 "$RUNS"); do
              echo "::group::Lighthouse ($preset) run $i/$RUNS"
              lighthouse "$URL" \
                --quiet \
                --chrome-flags="--headless --no-sandbox" \
                --output=json \
                --output-path="./lh-${preset}-${i}.json" \
                --only-categories=performance,accessibility,best-practices,seo,agentic-browsing \
                $EXTRA_FLAGS \
                --throttling-method=simulate
              echo "::endgroup::"
            done

            perf=$(median "lh-${preset}-*.json" '.categories.performance.score * 100 | round')
            a11y=$(median "lh-${preset}-*.json" '.categories.accessibility.score * 100 | round')
            bp=$(median "lh-${preset}-*.json" '.categories["best-practices"].score * 100 | round')
            seo=$(median "lh-${preset}-*.json" '.categories.seo.score * 100 | round')
            agentic=$(jq -r '
              if .categories["agentic-browsing"] then
                (.categories["agentic-browsing"].auditRefs | map(.id) as $ids |
                  [.audits | to_entries[] | select(.key as $k | $ids | index($k)) | .value |
                    select((.scoreDisplayMode // "") | IN("notApplicable","manual","informative","error") | not)] |
                  "\([.[] | select((.score // 0) >= 0.9)] | length)/\(length)")
              else "n/a" end
            ' "lh-${preset}-1.json")

            sp=$([ "$perf" -ge "$PERF_MIN" ] && echo "✅" || echo "❌")
            sa=$([ "$a11y" -ge "$A11Y_MIN" ] && echo "✅" || echo "❌")
            sb=$([ "$bp"   -ge "$BP_MIN" ]   && echo "✅" || echo "❌")
            ss=$([ "$seo"  -ge "$SEO_MIN" ]  && echo "✅" || echo "❌")

            echo "| $preset | $perf ($sp) | $a11y ($sa) | $bp ($sb) | $seo ($ss) | $agentic |" >> comment.md

            {
              echo "${preset}_perf=$perf"
              echo "${preset}_a11y=$a11y"
              echo "${preset}_bp=$bp"
              echo "${preset}_seo=$seo"
            } >> "$GITHUB_OUTPUT"

            if [ "$perf" -lt "$PERF_MIN" ] || [ "$a11y" -lt "$A11Y_MIN" ] || [ "$bp" -lt "$BP_MIN" ] || [ "$seo" -lt "$SEO_MIN" ]; then
              FAILED=1
            fi
          done

          cat comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Lighthouse threshold(s) violated (min: perf=$PERF_MIN a11y=$A11Y_MIN bp=$BP_MIN seo=$SEO_MIN)."
            exit 1
          fi

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('comment.md')) return;
            const body = fs.readFileSync('comment.md', 'utf8');
            const { number } = context.payload.pull_request;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body,
            });

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: lh-*.json
