{{ hero }}

<section data-test-ssr>
  <article>
    <header><h3>SSR → Hydration</h3></header>
    <p>Server rendered {{ items.length }} items below. Client hydration attaches reactivity.</p>
    <output data-hydration-status>Hydrating...</output>
    <ul data-bn="bn-list" data-grouped="true" role="list">
      <template @for="item of items; track item.id">
        <li data-bn="bn-list-row">
          <p data-bn="bn-list-title">{{ item.name }}</p>
          <p data-bn="bn-list-value">{{ item.status }}</p>
        </li>
      </template>
    </ul>
  </article>
</section>

<section data-test-reactive>
  <article>
    <header><h3>Reactive Updates</h3></header>
    <p>
      Mutate signals below and watch the DOM update instantly — no markForCheck, no detectChanges.
    </p>
    <output data-test-output>Ready</output>
    <nav data-controls aria-label="Item list controls">
      <button data-test-action="add">Add Item</button>
      <button data-test-action="remove">Remove Last</button>
      <button data-test-action="toggle">Toggle Visibility</button>
    </nav>
  </article>

  <article data-test-counter>
    <header><h3>Signal Counter</h3></header>
    <output data-counter-value>0</output>
    <nav data-controls aria-label="Counter controls">
      <button data-test-action="decrement">
        <img src="/icons/minus.svg" alt="Decrement" width="16" height="16" />
      </button>
      <button data-test-action="increment">
        <img src="/icons/plus.svg" alt="Increment" width="16" height="16" />
      </button>
    </nav>
  </article>

  <article data-test-computed>
    <header><h3>Computed Derivation</h3></header>
    <ul role="list" data-test-list></ul>
    <template @if="visible()">
      <p>Items visible — count: <strong data-test-count>0</strong></p>
    </template>
    <template @else>
      <p>Items hidden by signal toggle</p>
    </template>
  </article>
</section>

<script type="application/json" data-initial-items>
  {{ itemsJson }}
</script>
<script type="module" src="/test-signals.js"></script>
