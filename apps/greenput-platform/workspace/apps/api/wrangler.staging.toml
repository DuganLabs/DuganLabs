# Staging environment wrangler config.
# Used by scripts/staging/setup.sh and CI deploy.

name = "greenput-api-staging"
main = "src/index.ts"
compatibility_date = "2026-04-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "greenput-staging"
database_id = "2a19b75f-fa0a-4796-b368-062e6a7a2912"

[[kv_namespaces]]
binding = "SESSIONS"
id = "da77213ad4a14faba98a49ba57ed8dcb"

[[r2_buckets]]
binding = "FILES"
bucket_name = "greenput-files-staging"

[durable_objects]
bindings = [
  { name = "CHAT_ROOM", class_name = "ChatRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

# Custom domain for staging (requires greenput.site zone on Cloudflare):
# [[routes]]
# pattern = "api.greenput.site"
# custom_domain = true

[vars]
ENVIRONMENT = "staging"
BRAND_ORIGIN = ""

[dev]
port = 8787
local_protocol = "http"
