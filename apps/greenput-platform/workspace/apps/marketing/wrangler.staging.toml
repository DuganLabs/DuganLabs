# Staging environment wrangler config.
# Used by scripts/staging/setup.sh and CI deploy (also copied into place for
# PR preview deploys of the marketing worker).

name = "greenput-marketing-staging"
main = "src/worker/index.ts"
compatibility_date = "2026-04-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Same staging database as apps/api (see apps/api/wrangler.staging.toml).
[[d1_databases]]
binding = "DB"
database_name = "greenput-staging"
database_id = "2a19b75f-fa0a-4796-b368-062e6a7a2912"

# Product screenshots for /features (apps/marketing/assets/screens/*.webp),
# captured from the real app by scripts/screenshots/capture.mjs and served as
# Workers static assets: a request for /screens/leads.webp is answered from
# this directory before the Worker runs; every other path still reaches
# src/worker/index.ts (not_found_handling stays "none").
[assets]
directory = "./assets"

[vars]
ENVIRONMENT = "staging"
CONTACT_WORKSPACE_SLUG = "duganlabs"

[dev]
port = 8790
local_protocol = "http"
