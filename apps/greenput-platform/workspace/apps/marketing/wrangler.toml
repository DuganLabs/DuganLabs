name = "greenput-marketing"
main = "src/worker/index.ts"
compatibility_date = "2026-04-23"
compatibility_flags = ["nodejs_compat"]

routes = [
  # greenput.com and www now serve the DuganLabs coming-soon page (Worker
  # dl-greenput, DuganLabs/DuganLabs apps/greenput). This marketing site lives
  # at private.greenput.com behind Cloudflare Access (owner only).
  { pattern = "private.greenput.com/*", zone_name = "greenput.com" }
]

# Same production database as apps/api: contact-form submissions are written
# as leads (source "website") in the Greenput-owned workspace below so they
# show up in the platform's Leads route.
[[d1_databases]]
binding = "DB"
database_name = "greenput"
database_id = "ec38a8c4-b992-4a92-b809-27554ae806af"

# Product screenshots for /features (apps/marketing/assets/screens/*.webp),
# captured from the real app by scripts/screenshots/capture.mjs and served as
# Workers static assets: a request for /screens/leads.webp is answered from
# this directory before the Worker runs; every other path still reaches
# src/worker/index.ts (not_found_handling stays "none").
[assets]
directory = "./assets"

[vars]
ENVIRONMENT = "production"
CONTACT_WORKSPACE_SLUG = "duganlabs"

[dev]
port = 8790
local_protocol = "http"
