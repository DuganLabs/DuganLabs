# greenput.com: standard DuganLabs site Worker (libs/coming-soon).
# NOTE: greenput.com carries Proton Mail (MX/TXT): never touch them. Only the
# marketing site (greenput-marketing: apex + www) moves to private.greenput.com.
# app./api./demo./brand. and tenant *.greenput.com stay public: they are the
# product pilot customers use. Reserve "private" as a tenant slug.
# Config as code. Nothing here has been deployed; routes go live only with
# the owner's approval (PLAN.md D2 for live sites).
name = "dl-greenput"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false

observability = { enabled = true }

# Every public page is served by this Worker; /app/* is additionally behind
# Cloudflare Access (infra/cloudflare/access.tf).
routes = [
  { pattern = "greenput.com/*", zone_name = "greenput.com" },
  { pattern = "www.greenput.com/*", zone_name = "greenput.com" },
]

[[services]]
binding = "LEADS"
service = "dl-leads"

# Secrets (never committed; this repo is public). Pushed from Doppler
# duganlabs/repository at deploy with `wrangler secret bulk`:
#   OWNER_EMAILS   who may open /app (Access enforces it first)
[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAGUwXnIJpHMI3vwL" # Turnstile widget "DuganLabs landing pages (live)" (public)
ACCESS_TEAM_DOMAIN = "duganlabs.cloudflareaccess.com"
ACCESS_AUD = "f763f132679a391c90c1117a3bb1e82f72f18f8ac265c19b44b4a39709078551" # Access app "greenput private"

[env.staging]
name = "dl-greenput-staging"
workers_dev = true
routes = []
[[env.staging.services]]
binding = "LEADS"
service = "dl-leads-staging"
[env.staging.vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAGUyuK_Dx6XpaYx2" # Turnstile widget "DuganLabs landing pages (staging)" (public)
ACCESS_TEAM_DOMAIN = "duganlabs.cloudflareaccess.com"
ACCESS_AUD = "" # staging has no Access app; /app fails closed (403)
