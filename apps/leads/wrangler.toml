# dl-leads: shared lead store. No public route on purpose: only site Workers
# reach it, through their LEADS service binding.
name = "dl-leads"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "dl-leads"
database_id = "18f13f55-ba7d-4323-ac39-0b67e5703d79"
migrations_dir = "migrations"

# Secrets (Doppler duganlabs/repository -> `wrangler secret bulk` at deploy):
#   TURNSTILE_SECRETS (JSON {sitekey: secret}, one entry per Turnstile widget), IP_SALT
#   (local dev: TURNSTILE_SECRET_KEY in .dev.vars, Cloudflare's always-pass test secret)

[env.staging]
name = "dl-leads-staging"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "dl-leads-staging"
database_id = "5e540ab4-2957-4974-bf54-040af4d9a461"
migrations_dir = "migrations"
