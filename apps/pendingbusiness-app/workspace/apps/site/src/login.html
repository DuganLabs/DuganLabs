<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="description" content="Sign in to PendingBusiness with a passkey." />
    <meta name="theme-color" content="#0F0E0C" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PendingBusiness" />
    <meta property="og:title" content="Sign in · PendingBusiness" />
    <meta
      property="og:description"
      content="Passkey-only sign-in. No passwords, no shared secrets."
    />
    <meta property="og:url" content="https://pendingbusiness.com/login" />
    <meta property="og:image" content="https://pendingbusiness.com/og-default.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PendingBusiness — treasury OS for one" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://pendingbusiness.com/og-default.png" />
    <title>Sign in · PendingBusiness</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#0F0E0C" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PendingBusiness" />
    <link rel="canonical" href="https://pendingbusiness.com/login" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-bn-page="login">
    <header>
      <nav aria-label="primary">
        <p data-bn="wordmark">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <circle cx="8" cy="8" r="6.1" fill="none" stroke="currentColor" stroke-width="1.4" />
            <path
              d="M8 8 L5.2 6.2"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
            <path
              d="M8 8 L10.4 5.4"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linecap="round"
            />
          </svg>
          PendingBusiness
        </p>
        <h1>Sign in</h1>
      </nav>
    </header>

    <main>
      <section aria-labelledby="login-heading">
        <h2 id="login-heading">Passkey</h2>
        <p>Use the passkey you set up on this device.</p>
        <output id="login-status" aria-live="polite"></output>
        <form id="login-form" novalidate><!--bn:login-fields--></form>
        <p>
          <small>
            PendingBusiness is invitation-only — use the handle you were given. Adding a passkey to
            another device? <a href="/account">Account page.</a>
          </small>
        </p>
      </section>
    </main>

    <footer>
      <p>
        <small>PendingBusiness · DuganLabs · <time datetime="2026">2026</time></small>
      </p>
    </footer>

    <script type="module" src="/login.js"></script>
  </body>
</html>
