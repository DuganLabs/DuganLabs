# theduganhouse.com: standard DuganLabs site Worker (libs/coming-soon).
# NOTE: theduganhouse.com carries iCloud custom-domain mail (MX/TXT). Custom
# domains add only A/AAAA for apex + www; never touch MX/TXT/DKIM records.
# Config as code. Nothing here has been deployed; routes go live only with
# the owner's approval (PLAN.md D2 for live sites).
name = "dl-theduganhouse"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false

observability = { enabled = true }

# Every public page is served by this Worker; /app/* is additionally behind
# Cloudflare Access (infra/cloudflare/access.tf).
routes = [
  { pattern = "theduganhouse.com", custom_domain = true },
  { pattern = "www.theduganhouse.com", custom_domain = true },
]

[[services]]
binding = "LEADS"
service = "dl-leads"

# Secrets (never committed; this repo is public). Pushed from Doppler
# duganlabs/repository at deploy with `wrangler secret bulk`:
#   OWNER_EMAILS   who may open /app (Access enforces it first)
[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAGUwXUM0-4nsXFna" # Turnstile widget "DuganLabs landing pages (new)" (public)
ACCESS_TEAM_DOMAIN = "duganlabs.cloudflareaccess.com"
ACCESS_AUD = "5d1e411a38066a81cb8e9fe80fbe0501c5a31a565053724cfa6ac4637108b462" # Access app "theduganhouse private"

[env.staging]
name = "dl-theduganhouse-staging"
workers_dev = true
routes = []
[[env.staging.services]]
binding = "LEADS"
service = "dl-leads-staging"
[env.staging.vars]
TURNSTILE_SITE_KEY = "1x00000000000000000000AA" # Cloudflare always-pass TEST key (staging only)
ACCESS_TEAM_DOMAIN = "duganlabs.cloudflareaccess.com"
ACCESS_AUD = "TODO-phase3"
